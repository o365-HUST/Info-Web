<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="100%" height="100%">
  <defs>
    <linearGradient id="o365MarkGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00A2ED" />
      <stop offset="35%" stop-color="#0072CE" />
      <stop offset="70%" stop-color="#004EAA" />
      <stop offset="100%" stop-color="#072B61" />
    </linearGradient>

    <linearGradient id="o365MarkHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0050B3" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Base Outer Ring and Dynamic Body -->
    <path d="M 230,25 
             C 340,25 425,110 425,220 
             C 425,330 340,415 230,415 
             C 175,415 125,393 90,357 
             C 88,375 85,403 82,433 
             C 80,434 78,433 78,431 
             C 76,380 80,305 92,260 
             C 82,215 95,160 130,105 
             C 158,61 192,25 230,25 Z" 
          fill="url(#o365MarkGrad)" />

    <!-- Negative Space Center Loop -->
    <ellipse cx="260" cy="240" rx="95" ry="92" fill="#FFFFFF" />

    <!-- Swoosh slash (White dynamic cutting curve through the upper sector) -->
    <path d="M 115,280 
             C 160,150 230,73 375,67 
             C 378,73 375,81 370,83 
             C 235,93 170,170 125,295 
             C 120,305 112,295 115,280 Z" 
          fill="#FFFFFF" />

    <!-- Overlay shading and dimensional wing on upper curve -->
    <path d="M 225,29 
             C 330,31 415,111 418,215 
             C 400,125 320,80 230,79 
             C 185,79 145,95 118,120 
             C 150,65 186,29 225,29 Z" 
          fill="url(#o365MarkHighlight)" opacity="0.9" />

    <!-- Distinctive Lower Left Tail / Speech Notch -->
    <path d="M 84,425 
             C 82,375 84,315 100,255 
             C 85,290 82,350 84,425 Z" 
          fill="#0096EB" />
  </g>
</svg>
